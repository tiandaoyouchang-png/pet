name: Render UI Preview

on:
  workflow_dispatch:
  push:
    branches: [ui/apple-polish]
    paths:
      - 'momo_app.py'
      - 'momo_ui.py'
      - 'pixar_pet.py'
      - 'tools/render_actual_preview.py'
      - '.github/workflows/render-ui-preview.yml'

jobs:
  render:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'PySide6>=6.5,<7' 'pyobjc-framework-Cocoa>=10.0'
      - name: Render actual UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/render_actual_preview.py
      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: momo-ui-preview
          path: artifacts/ui-preview/*.png
          if-no-files-found: error
